name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,aws]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src tests --strict

      - name: Test
        run: pytest -q
